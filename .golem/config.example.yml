# Golem configuration — copy to `.golem/config.yml` and customize.
#
# All settings are optional. Anything you omit falls back to the
# built-in default in lib/golem/application.ex.
#
# Precedence (highest first):
#   1. GOLEM_* environment variable
#   2. This file
#   3. Built-in default
#
# The whole .golem/ directory is gitignored — your personal config
# stays local. Commit this `.example.yml` as the template.

models:
  # Used to produce the initial plan and revisions.
  planner: claude-opus-4-7

  # Used for step-by-step execution.
  executor: claude-opus-4-7

  # Optional: model used for compaction summaries. Falls back to
  # `executor` if unset. Sonnet is a good cost/quality pick here.
  # compaction: claude-sonnet-4-6

limits:
  # Hard step ceiling for a single run (main loop, excludes sub-agents).
  max_steps: 200

  # Cost ceiling in USD. Run aborts past this.
  max_cost: 10.0

  # Extended-thinking budget per turn (integer token budget, or string
  # "low"/"medium"/"high" for Opus 4.7+ adaptive thinking).
  #
  # WARNING: enabling thinking on Opus 4.7+ breaks prompt caching —
  # every call creates a fresh cache entry, eliminating the ~90%
  # input-token discount. Leave unset (no thinking) unless a run
  # genuinely needs reasoning more than it needs cheap context reuse.
  # thinking_budget: 10000

  # Shell command timeout in milliseconds.
  command_timeout: 900000

  # Shell stall detection — kill if no output for this long (ms).
  stall_timeout: 120000

  # Token/step caps for the planner phase.
  planner_max_tokens: 16000
  planner_max_steps: 75

  # Max tokens per executor response.
  executor_max_tokens: 16000

container:
  # Name of the podman/docker container to exec into.
  name: golem-vm

  # Image used to create the container if it doesn't exist yet.
  image: golem-vm:latest

  # User to run setup steps as by default (can be overridden per-step
  # in .golem/projects.yml).
  user: agent

  # Host-path → container-path mounts, applied when golem creates the
  # container on startup. Missing src paths are silently skipped
  # unless `required: true` is set.
  #
  # Fields:
  #   src       — host path, relative to the golem repo root or absolute
  #   dest      — absolute path inside the container
  #   readonly  — mount :ro (default: false)
  #   required  — fail startup if src is missing (default: false)
  mounts:
    - src: ssh
      dest: /home/agent/.ssh
      readonly: true
    - src: .golem/gcloud-sa.json
      dest: /home/agent/.config/gcloud/application_default_credentials.json
      readonly: true

  # Environment variables passed into the container. Two forms:
  #
  # 1. Bare string: pass-through from host env if the variable is set
  #    and non-empty. Useful for per-user config like git identity.
  # 2. Map {name, value, when_file?}: static value. `when_file` (host
  #    path) gates the variable — only set if that file exists. Useful
  #    for linking secrets to their mount (e.g. only point to gcloud
  #    creds if the cred file was actually mounted).
  env:
    - GIT_USER
    - GIT_EMAIL
    - name: GOOGLE_APPLICATION_CREDENTIALS
      value: /home/agent/.config/gcloud/application_default_credentials.json
      when_file: .golem/gcloud-sa.json
