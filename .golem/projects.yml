bitbucket:
  workspace: hrdl

default_branch: master

projects:
  - repo: hrdl/api
    path: /home/agent/api
    description: "Laravel JSON API"
    setup:
      - label: "add php ppa"
        run: "DEBIAN_FRONTEND=noninteractive apt-get update -qq && apt-get install -y -qq software-properties-common && add-apt-repository -y ppa:ondrej/php 2>/dev/null; apt-get update -qq"
      - label: "install php 8.4"
        run: "DEBIAN_FRONTEND=noninteractive apt-get install -y -qq php8.4 php8.4-dev php8.4-curl php8.4-mbstring php8.4-gd php8.4-bcmath php8.4-mysql php8.4-pgsql php8.4-sqlite3 php8.4-redis php8.4-opcache php8.4-readline php8.4-xml php8.4-zip php8.4-grpc php8.4-imagick sqlite3 unzip poppler-utils"
      - label: "install composer"
        run: "command -v composer || curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer"
      - label: "composer install"
        run: "cd /home/agent/api && composer install --no-interaction --prefer-dist"
        user: agent
      - label: "configure env"
        run: "cd /home/agent/api && (test -f .env || (cp .env.example .env && php artisan key:generate))"
        user: agent
      - label: "generate passport keys"
        run: "cd /home/agent/api && php artisan passport:keys --force --no-interaction && chmod 600 storage/oauth-*.key"
        user: agent

  - repo: hrdl/app
    path: /home/agent/app
    description: "Vue 2 SPA"
