# Golem configuration — copy to `.golem/config.yaml` and customize.
#
# All settings are optional. Anything you omit falls back to the
# built-in default in lib/golem/application.ex.
#
# Precedence (highest first):
#   1. GOLEM_* environment variable
#   2. This file
#   3. Built-in default
#
# The whole .golem/ directory is gitignored — your personal config
# stays local. Commit this `.example.yaml` as the template.

models:
  # Each role is a map of `provider` + `model`. Supported providers:
  # `anthropic`, `openrouter`.

  # Used to produce the initial plan and revisions.
  planner:
    provider: anthropic
    model: claude-opus-4-7

  # Used for step-by-step execution. Sonnet is the default: ~1/5 the
  # cost of Opus with faster TTFT, reliable on read/edit/test loops.
  # Switch to claude-opus-4-7 if you see executor quality regressions,
  # or route to OpenRouter for cheaper models:
  #
  #   executor:
  #     provider: openrouter
  #     model: qwen/qwen-2.5-coder-32b-instruct
  executor:
    provider: anthropic
    model: claude-sonnet-4-6

  # Optional: model used for compaction summaries. Falls back to
  # `executor` if unset.
  # compaction:
  #   provider: anthropic
  #   model: claude-sonnet-4-6

# Per-provider settings. Most users only need the defaults — the
# Anthropic key is read from ANTHROPIC_API_KEY and OpenRouter's from
# OPENROUTER_API_KEY. Override `api_key_env` to look in a different
# env var, or `base_url` for a self-hosted gateway.
#
# providers:
#   anthropic:
#     api_key_env: ANTHROPIC_API_KEY
#   openrouter:
#     api_key_env: OPENROUTER_API_KEY
#     base_url: https://openrouter.ai/api/v1

# Optional: override token pricing per model. Values are USD per
# million tokens. Useful when Anthropic bumps prices between Golem
# releases, or once multi-provider support lands. Partial overrides
# are allowed — unspecified keys fall back to the built-in defaults.
#
# pricing:
#   claude-opus-4-7:
#     input: 15.0
#     output: 75.0
#     cache_read: 1.5
#     cache_create: 18.75
#   claude-sonnet-4-6:
#     input: 3.0
#     output: 15.0
#     cache_read: 0.3
#     cache_create: 3.75

limits:
  # Hard step ceiling for a single run (main loop, excludes sub-agents).
  max_steps: 200

  # Cost ceiling in USD. Run aborts past this.
  max_cost: 10.0

  # Extended-thinking budget per turn (integer token budget, or string
  # "low"/"medium"/"high" for Opus 4.7+ adaptive thinking).
  #
  # WARNING: enabling thinking on Opus 4.7+ breaks prompt caching —
  # every call creates a fresh cache entry, eliminating the ~90%
  # input-token discount. Leave unset (no thinking) unless a run
  # genuinely needs reasoning more than it needs cheap context reuse.
  # thinking_budget: 10000

  # Shell command timeout in milliseconds.
  command_timeout: 900000

  # Shell stall detection — kill if no output for this long (ms).
  stall_timeout: 120000

  # Token/step caps for the planner phase.
  planner_max_tokens: 16000
  planner_max_steps: 75

  # Max tokens per executor response.
  executor_max_tokens: 16000

  # Total prompt budget per model call, in tokens. 200000 is the
  # standard window for Sonnet 4.6 / Opus 4.7. Raising this above
  # 200000 automatically enables Anthropic's 1M-context beta header
  # and incurs 2× input pricing on every token beyond the 200K mark.
  # The compaction trigger is derived as `context_window - 15000`.
  context_window: 200000

container:
  # Name of the podman/docker container to exec into.
  name: golem-vm

  # Image used to create the container if it doesn't exist yet.
  image: localhost/golem-vm:latest

  # User to run setup steps as by default (can be overridden per-step
  # in .golem/projects.yml).
  user: agent

  # Host-path → container-path mounts, applied when golem creates the
  # container on startup. Missing src paths are silently skipped
  # unless `required: true` is set.
  #
  # Fields:
  #   src       — host path. `~/...` expands to your home dir.
  #               Bare relative paths are resolved against your CWD.
  #   dest      — absolute path inside the container
  #   readonly  — mount :ro (default: false)
  #   required  — fail startup if src is missing (default: false)
  mounts:
    # SSH key for git push/pull. Pick whichever source matches your
    # setup — a dedicated key in `<repo>/ssh/` (see the "Git access"
    # section of README), or your normal `~/.ssh` directory.
    - src: ~/.ssh
      dest: /home/agent/.ssh
      readonly: true

  # Environment variables passed into the container. Two forms:
  #
  # 1. Bare string: pass-through from host env if the variable is set
  #    and non-empty. Useful for per-user config like git identity.
  # 2. Map {name, value, when_file?}: static value. `when_file` (host
  #    path) gates the variable — only set if that file exists. Useful
  #    for linking secrets to their mount (e.g. GOOGLE_APPLICATION_CREDENTIALS
  #    only set if the gcloud SA file was actually mounted).
  env:
    - GIT_USER
    - GIT_EMAIL

# --- Project setup ---
#
# Repos the agent works on and how to set each one up inside the
# container. This section replaces the legacy .golem/projects.yml.

# bitbucket:
#   workspace: your-workspace

# default_branch: main

# projects:
#   - repo: your-workspace/api
#     path: /home/agent/api
#     description: "Laravel JSON API"
#     branch_from: main
#     cache: [vendor]
#     instructions: |
#       Project-specific rules for the agent (verification steps,
#       conventions, test commands, etc).
#     setup:
#       - label: "composer install"
#         run: "composer install --no-interaction"
#         user: agent

# --- Jira integration ---
#
# Replaces the legacy .golem/jira.yml.

# jira:
#   base_url: https://your-company.atlassian.net
#   done_transition: "Pull Request / Deployable"
#   # Post status comments on the ticket (evaluation, success, failure,
#   # paused, error). Set to false to operate silently.
#   comment_on_ticket: true

